<!doctype html>
<!--
  The 1200x630 link-preview card (og:image) for macsweat.parthh.dev.
  Render it to site/assets/og.png from the repo root:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1200,630 --user-data-dir="$(mktemp -d)" \
    --allow-file-access-from-files --virtual-time-budget=2000 \
    --screenshot="$PWD/site/assets/og.png" "file://$PWD/Tools/og-card.html"

  --allow-file-access-from-files lets the page load the site's font from disk; without it the headline falls back to the system font.

  Then bump the ?v= on og:image and twitter:image in site/index.html so caches fetch the new one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MacSweat link preview</title>
<style>
  /* The site's display font (site/assets/fonts, SIL OFL 1.1). */
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 500 800; src: url("../site/assets/fonts/bricolage-grotesque-latin.woff2") format("woff2"); }
  :root {
    --bg: #0f0f10; --text: #f4e9d6; --muted: #a8a093; --faint: #7b756b; --cream: #f4e4c8; --accent: #ff7a2f;
    --display: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased;
  }
  /* The same warm tint as the site's hero while its demo Mac is hot (.heat in site/index.html). */
  .heat { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 112, 40, 0.085), rgba(255, 112, 40, 0.03) 58%, transparent); }
  .copy { position: absolute; left: 80px; top: 72px; width: 560px; height: 486px; display: flex; flex-direction: column; }
  .icon { width: 112px; height: 112px; margin: -10px 0 0 -10px; filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.55)); }
  h1 { font: 700 78px/1.02 var(--display); letter-spacing: -0.025em; margin: 22px 0 0; }
  h1 em { font-style: normal; color: var(--accent); }
  p { margin: 22px 0 0; font-size: 27px; line-height: 1.35; color: var(--muted); max-width: 520px; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 18px; font-size: 21px; color: var(--faint); white-space: nowrap; }
  .foot b { font: 500 21px var(--mono); color: var(--cream); }
  .shot {
    position: absolute; right: 80px; top: 64px; width: 430px; height: auto;
    border-radius: 22px; border: 1px solid rgba(244, 228, 200, 0.18);
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.95);
  }
  /* The panel runs off the bottom edge; fade it into the background there. */
  .fade { position: absolute; right: 0; bottom: 0; width: 640px; height: 120px; background: linear-gradient(transparent, var(--bg)); }
</style>
</head>
<body>
  <div class="heat"></div>
  <img class="shot" src="../site/assets/screenshot-dark.png" alt="">
  <div class="fade"></div>
  <div class="copy">
    <img class="icon" src="../site/assets/icon.png" alt="">
    <h1>Why is your Mac <em>sweating?</em></h1>
    <p>A menu bar app that names what’s heating up your Mac, down to the dev server you forgot to stop.</p>
    <div class="foot"><b>macsweat.parthh.dev</b><span>Free · Mac only</span></div>
  </div>
</body>
</html>
