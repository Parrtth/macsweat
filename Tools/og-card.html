<!doctype html>
<!--
  The 1200x630 link-preview card (og:image) for macsweat.parthh.dev.
  Render it to site/assets/og.png from the repo root:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1200,630 --user-data-dir="$(mktemp -d)" \
    --allow-file-access-from-files --virtual-time-budget=2000 \
    --screenshot="$PWD/site/assets/og.png" "file://$PWD/Tools/og-card.html"

  --allow-file-access-from-files lets the page load the site's font from disk; without it the headline falls back to the system font.

  Then bump the ?v= on og:image and twitter:image in site/index.html so caches fetch the new one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MacSweat link preview</title>
<style>
  /* The site's display font (site/assets/fonts, SIL OFL 1.1). */
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 500 800; src: url("../site/assets/fonts/bricolage-grotesque-latin.woff2") format("woff2"); }
  :root {
    --ink: #1b100a;
    --display: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  html, body { margin: 0; }
  /* The site's hero while its demo Mac is hot: the same desktop, menu bar and panel (.desk, .heat and .bar in site/index.html). */
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: radial-gradient(110% 130% at 74% 30%, #ffa253 0%, #ff6a2b 40%, #f8501f 100%);
    color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased;
  }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 48px; padding: 0 80px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(255, 255, 255, 0.34); border-bottom: 1px solid rgba(27, 16, 10, 0.08); font: 500 18px/1 var(--sans); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .brand img { width: 30px; height: 30px; }
  .right { display: flex; align-items: center; gap: 16px; font-variant-numeric: tabular-nums; }
  .status { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.6); font-weight: 600; color: #c21a0e; }
  .status svg { width: 25px; height: 20px; }
  .copy { position: absolute; left: 80px; top: 118px; width: 600px; height: 446px; display: flex; flex-direction: column; }
  h1 { font: 800 88px/0.94 var(--display); letter-spacing: -0.045em; margin: 0; }
  p { margin: 28px 0 0; font-size: 27px; line-height: 1.35; max-width: 540px; text-wrap: balance; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 18px; font-size: 21px; white-space: nowrap; }
  .foot b { font: 600 21px var(--mono); }
  .foot span { opacity: 0.86; }
  /* The panel hangs from the status item and runs off the bottom edge. */
  .shot { position: absolute; right: 80px; top: 62px; width: 440px; }
  .shot img { display: block; width: 100%; height: auto; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px rgba(27, 16, 10, 0.1), 0 40px 80px -24px rgba(40, 20, 10, 0.55); }
  .shot::before { content: ""; position: absolute; top: -7px; left: var(--arrow, 66%); width: 16px; height: 16px; margin-left: -8px; background: #fff; border-radius: 3px 0 0 0; transform: rotate(45deg); box-shadow: -1px -1px 0 rgba(27, 16, 10, 0.1); }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand"><img src="../site/assets/icon.png" alt="">MacSweat</div>
    <div class="right">
      <span class="status" id="status">
        <svg viewBox="0 0 22 18" aria-hidden="true">
          <path fill="currentColor" fill-rule="evenodd" d="M5.2 6.6c1.9 0 3.4 1.8 3.4 4s-1.5 4-3.4 4-3.4-1.8-3.4-4 1.500-4 3.400-4zm1 1.600a1.800 1.800 0 1 0 0 3.600 1.800 1.800 0 0 0 0-3.600zM13.400 6.600c1.900 0 3.400 1.800 3.400 4s-1.500 4-3.400 4-3.400-1.800-3.400-4 1.500-4 3.400-4zm1 1.600a1.800 1.800 0 1 0 0 3.600 1.800 1.800 0 0 0 0-3.600z"/>
          <path fill="currentColor" d="M18.900 0.800c0.700 1.800 2.300 3.200 2.300 4.900a2.300 2.300 0 0 1-4.600 0c0-1.700 1.600-3.100 2.300-4.900z"/>
        </svg>78%</span>
      <span>9:41</span>
    </div>
  </div>
  <div class="shot" id="shot"><img src="../site/assets/screenshot-light.png" alt=""></div>
  <div class="copy">
    <h1>Why is your<br>Mac sweating?</h1>
    <p>A menu bar app that names what’s heating up your Mac, down to the dev server you forgot to stop.</p>
    <div class="foot"><b>macsweat.parthh.dev</b><span>Free · Mac only</span></div>
  </div>
  <script>
    // Point the panel's arrow at the status item, as on the site.
    var s = document.getElementById('status').getBoundingClientRect(), shot = document.getElementById('shot'), p = shot.getBoundingClientRect();
    shot.style.setProperty('--arrow', (s.left + s.width / 2 - p.left) + 'px');
  </script>
</body>
</html>
